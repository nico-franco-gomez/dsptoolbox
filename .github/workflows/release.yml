---
name: Release

"on":
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release, for example v0.10.3
        required: true
        type: string

permissions:
  contents: read

env:
  PYTHON_VERSIONS: "cp311-* cp312-* cp313-* cp314-*"

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag and extract release notes
        id: metadata
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          match = re.fullmatch(r"v(\d+\.\d+\.\d+)", tag)
          if match is None:
              raise SystemExit(
                  f"Release tag must have the form vX.Y.Z, got {tag!r}"
              )
          version = match.group(1)

          python_text = Path("dsptoolbox/__init__.py").read_text()
          cargo_text = Path("Cargo.toml").read_text()
          python_version = re.search(
              r'__version__\s*=\s*["\']([^"\']+)', python_text
          )
          cargo_version = re.search(
              r'^version\s*=\s*["\']([^"\']+)', cargo_text, re.MULTILINE
          )
          if python_version is None or cargo_version is None:
              raise SystemExit("Could not find package versions")
          versions = {
              version,
              python_version.group(1),
              cargo_version.group(1),
          }
          if versions != {version}:
              raise SystemExit(
                f"Version mismatch: tag={version}, "
                f"Python={python_version.group(1)}, "
                  f"Cargo={cargo_version.group(1)}"
              )

          changelog = Path("CHANGELOG.rst").read_text()
          heading = re.compile(
              rf"^`{re.escape(version)}\s+<[^>]+>`_\s*-\s*$",
              re.MULTILINE,
          )
          heading_match = heading.search(changelog)
          if heading_match is None:
              raise SystemExit(f"CHANGELOG.rst has no entry for {version}")
          next_heading = re.search(
              r"^`\d+\.\d+(?:\.\d+)?\s+<",
              changelog[heading_match.end():],
              re.MULTILINE,
          )
          end = (
              heading_match.end() + next_heading.start()
              if next_heading
              else len(changelog)
          )
          notes = changelog[heading_match.start():end].strip()

          Path("release-notes.rst").write_text(notes + "\n")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"version={version}\n")
          PY

      - name: Publish release notes output
        id: notes
        run: |
          {
            echo 'notes<<RELEASE_NOTES'
            cat release-notes.rst
            echo 'RELEASE_NOTES'
          } >> "$GITHUB_OUTPUT"

      - name: Upload release notes
        uses: actions/upload-artifact@v5
        with:
          name: release-notes
          path: release-notes.rst

  build-wheels:
    name: Build wheels (${{ matrix.name }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            archs: x86_64
          - name: linux-aarch64
            runner: ubuntu-latest
            archs: aarch64
          - name: macos-x86_64
            runner: macos-15-intel
            archs: x86_64
          - name: macos-arm64
            runner: macos-14
            archs: arm64
          - name: windows-x86_64
            runner: windows-latest
            archs: AMD64
          - name: windows-arm64
            runner: windows-11-arm
            archs: ARM64
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up QEMU
        if: startsWith(matrix.name, 'linux-')
        uses: docker/setup-qemu-action@v3

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_BUILD: ${{ env.PYTHON_VERSIONS }}
          CIBW_ARCHS: ${{ matrix.archs }}
          CIBW_ENVIRONMENT_MACOS: >-
            ${{ matrix.name == 'macos-x86_64' &&
            'MACOSX_DEPLOYMENT_TARGET=10.12' || '' }}
          CIBW_BEFORE_TEST_LINUX: >-
            if command -v apk >/dev/null 2>&1; then
              apk add --no-cache portaudio-dev libsndfile-dev;
            else
              yum install -y portaudio-devel libsndfile-devel;
            fi
          CIBW_TEST_COMMAND: >-
            python -c "from dsptoolbox._rust import lattice_filtering_fir,
            warp_time_series"
          CIBW_BUILD_VERBOSITY: "1"
        with:
          output-dir: wheelhouse

      - name: Upload wheels
        uses: actions/upload-artifact@v5
        with:
          name: wheels-${{ matrix.name }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  build-sdist:
    name: Build source distribution
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install maturin
        run: python -m pip install maturin

      - name: Build source distribution
        run: maturin sdist --out dist

      - name: Upload source distribution
        uses: actions/upload-artifact@v5
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: [validate, build-wheels, build-sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: "wheels-*"
          path: dist
          merge-multiple: true

      - name: Download source distribution
        uses: actions/download-artifact@v5
        with:
          name: sdist
          path: dist

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check distribution metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*
          test "$(find dist -name '*.whl' | wc -l)" -eq 24
          test "$(find dist -name '*.tar.gz' | wc -l)" -eq 1

      - name: Download release notes
        uses: actions/download-artifact@v5
        with:
          name: release-notes
          path: .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          body_path: release-notes.rst
          files: dist/*
          fail_on_unmatched_files: true
