[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "dsptoolbox"
dynamic = ["version"]
license = "MIT"
authors = [{ name = "Nicolas Franco-Gomez" }]
description = "Collection of dsp algorithms to be used for analysis of audio signals"
readme = "README.rst"
keywords = ["Digital Signal Processing", "dsp", "Research", "Prototyping"]
requires-python = ">=3.11"
dependencies = [
  # See in combination with numba
  "numpy~=2.4; python_version < '3.12'",
  "numpy~=2.5; python_version >= '3.12'",
  # Independent
  "scipy~=1.17; python_version < '3.12'",
  "scipy~=1.18; python_version >= '3.12'",
  "soundfile~=0.14",
  "sounddevice~=0.5",
  "matplotlib~=3.11",
  "seaborn~=0.13",
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
use-numba = ["numba~=0.67"]

[project.urls]
Homepage = "https://github.com/nico-franco-gomez/dsptoolbox"
"Bug Tracker" = "https://github.com/nico-franco-gomez/dsptoolbox/issues"
Documentation = "https://dsptoolbox.readthedocs.io/en/latest/"

[tool.hatch.envs.docs]
dependencies = [
  "sphinx",
  "furo",
  "numpydoc",
  "readthedocs-sphinx-search",
  "autodocsumm",
]

[tool.hatch.envs.dev]
dependencies = ["ruff", "twine", "hatch", "maturin", "wheel"]

[tool.maturin]
bindings = "pyo3"
module-name = "dsptoolbox._rust"
python-source = "."

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
  "E4", "E7", "E9", "F", # ruff defaults
  "B",  # flake8-bugbear: catches real-bug-shaped patterns (e.g. mutable defaults)
  "I",  # isort: import sorting
  "UP", # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
"dsptoolbox/__init__.py" = ["I001"]

[tool.mypy]
python_version = "3.11"

[[tool.mypy.overrides]]
module = [
  "scipy.*",
  "seaborn.*",
  "librosa.*",
  "sounddevice.*",
  "soundfile.*",
  "numba.*",
  "mpl_toolkits.*",
  "numpy",
  "numpy.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.hatch.version]
path = "dsptoolbox/__init__.py"

[tool.hatch.build]
include = [
  "dsptoolbox/**",
]

exclude = [
  "__pycache__/**",
  "*.wav",
  "*.flac"
]
